services:
  wiza-mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wiza-mcp-server
    restart: unless-stopped
    environment:
      # Required: Wiza API key
      - WIZA_API_KEY=${WIZA_API_KEY}

      # Optional: Wiza base URL override
      - WIZA_BASE_URL=${WIZA_BASE_URL:-https://wiza.co}

      # Optional: JWT authentication
      - MCP_JWT_SECRET=${MCP_JWT_SECRET:-}
      - MCP_JWT_TOKEN=${MCP_JWT_TOKEN:-}
      - MCP_JWT_ALGORITHM=${MCP_JWT_ALGORITHM:-HS256}
      - MCP_JWT_AUDIENCE=${MCP_JWT_AUDIENCE:-}
      - MCP_JWT_ISSUER=${MCP_JWT_ISSUER:-}

      # Optional: Rate limiting configuration
      - WIZA_RATE_LIMIT_MIN_TIME_MS=${WIZA_RATE_LIMIT_MIN_TIME_MS:-1000}
      - WIZA_RATE_LIMIT_MAX_CONCURRENT=${WIZA_RATE_LIMIT_MAX_CONCURRENT:-2}

      # Transport configuration (use 'sse' for Docker deployments)
      - MCP_TRANSPORT=${MCP_TRANSPORT:-sse}
      - MCP_PORT=${MCP_PORT:-3000}
      - MCP_ENDPOINT=${MCP_ENDPOINT:-/message}

      - NODE_ENV=production

    ports:
      - "${MCP_PORT:-3000}:${MCP_PORT:-3000}"

    stdin_open: true
    tty: true

    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:${MCP_PORT:-3000}/health", "||", "exit", "1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
